- name: Test clean multiline output
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Debug multiline
      debug:
        msg: |
          Line 1
          Line 2
          Line 3

    - name: Fail but allow
      fail:
        msg: |
          This is a fake failure.
          But it’s for testing only.
      ignore_errors: true

    - name: Skipped task
      debug:
        msg: This won't run
      when: false
